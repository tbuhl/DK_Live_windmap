# Render.com blueprint (free web service). Dashboard: New + -> Blueprint -> pick this repo -> Apply.
services:
  - type: web
    name: dk-wind
    runtime: python
    plan: free
    buildCommand: echo "nothing to build"
    startCommand: python serve.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
